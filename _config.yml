title: Christoph Hirche
description: >-
  Quantum information theory, quantum communication, and entropic methods.
  Research, publications, talks, and opportunities with Christoph Hirche.
url: "https://christophhirche.github.io"
baseurl: "/ChristophHirche"
lang: en
# Existing obfuscated contact text; change only after confirming the public address.
contact_text: "firstname.lastname@gmail.com"
analytics:
  google_id: "G-N71H8YPM4R"
  host: "christophhirche.github.io"

include:
  - _pages
exclude:
  - README.md
  - docs
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle

defaults:
  - scope:
      path: "_pages"
    values:
      layout: page

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  parse_block_html: true

plugins:
  - jekyll-sitemap
