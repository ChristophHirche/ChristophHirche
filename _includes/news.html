<ol class="news-list">
  {% assign article_limit = include.limit | default: site.data.news.size %}
  {% for article in site.data.news limit:article_limit %}
  <li>
    <p class="news-date">{{ article.date | escape }}</p>
    <div>{{ article.headline }}</div>
    {% if article.url %}<a href="{{ article.url | relative_url }}">{{ article.link_text | escape }}</a>{% endif %}
  </li>
  {% endfor %}
</ol>
