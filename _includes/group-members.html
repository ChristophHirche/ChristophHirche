<div class="group-grid" markdown="0">
  {% for member in site.data.group %}
  <article class="group-member">
    <img class="group-portrait" src="{{ member.image | relative_url }}" alt="" width="{{ member.image_width }}" height="{{ member.image_height }}" loading="lazy" decoding="async">
    <div class="group-copy">
      <p class="group-role">{{ member.role | escape }}</p>
      <h2>{{ member.name | escape }}</h2>
      <p class="group-focus"><span class="group-focus-label">Research interests</span>{{ member.focus | escape }}</p>
      <a class="group-profile" href="{{ member.profile | escape }}">Institute profile<span class="sr-only"> for {{ member.name | escape }}</span> <span aria-hidden="true">↗</span></a>
    </div>
  </article>
  {% endfor %}
</div>
