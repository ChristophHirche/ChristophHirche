<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% assign document_title = page.title | default: site.title %}
  {% assign description = page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines %}
  <title>{{ document_title | escape }}</title>
  <meta name="description" content="{{ description | escape }}">
  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:title" content="{{ document_title | escape }}">
  <meta property="og:description" content="{{ description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.image | default: '/images/Auswahl_6356.jpg' | absolute_url }}">
  <meta name="twitter:card" content="summary">
  {% include analytics.html %}
</head>
