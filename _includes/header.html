<header class="site-header">
  <div class="container header-inner">
    <a class="site-name" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true"><span class="brand-bracket">|</span><span class="brand-initials">CH</span><span class="brand-bracket">⟩</span></span><span>{{ site.title }}</span></a>
    <nav aria-label="Main navigation">
      <ul class="nav-list">
        {% for item in site.data.navigation %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title | escape }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
