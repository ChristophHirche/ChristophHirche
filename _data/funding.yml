    logo: quantumfrontiers
    title: QuantumFrontiers
    subtitle: Cluster of Excellence
    description: >-
      QuantumFrontiers brings together fundamental quantum physics and precision
      measurement. Its research spans the control of light and matter, the
      development of scalable quantum systems, and new sensors and measurement
      protocols. The cluster connects theoretical foundations with experimental
