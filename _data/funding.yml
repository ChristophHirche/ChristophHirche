current:
  - id: information-flow-divergences
    programme: DFG Research Grant
    award: Project 550206990
    image: /images/funding/dfg-funded-by-en.gif
    image_alt: Funded by the Deutsche Forschungsgemeinschaft (DFG, German Research Foundation)
    image_width: 800
    image_height: 260
    logo: dfg
    title: Tracking information flow in quantum networks via new divergence measures
    description: >-
      How does information change as it passes through a noisy quantum network?
      This project develops quantum divergence measures to study information loss
      and its limits. It investigates contraction under noise, including effects
      on entanglement and coherence, with applications to quantum circuits,
      network communication, and learning. The aim is to connect mathematical
      bounds with ways to assess the capabilities of noisy quantum systems.
    acknowledgement: >-
      Funded by the Deutsche Forschungsgemeinschaft (DFG, German Research
      Foundation), project 550206990.
    url: https://gepris.dfg.de/project/550206990?lang=en
    link_text: DFG project details

  - id: quics
    programme: BMFTR
    award: Grant 13N17418
    image: /images/funding/quics.png
    image_alt: QUICS
    image_width: 3438
    image_height: 1887
    logo: quics
    title: QUICS
    subtitle: Quantum Innovation and Computing for SMEs
    description: >-
      QUICS is a quantum-computing service centre for small and medium-sized
      enterprises. It helps assess potential applications through algorithm
      development, simulation, and access to quantum hardware and software.
      Simulations that account for realistic noise connect the study of quantum
      algorithms with the conditions in which devices operate. The centre also
      provides advice and training.
    acknowledgement: >-
      Supported by Germany’s Federal Ministry of Research, Technology and Space
      (BMFTR) through the QC service centre QUICS, grant 13N17418.
    url: https://quics.gwdg.de/en/
    link_text: Explore QUICS

  - id: quantumfrontiers
