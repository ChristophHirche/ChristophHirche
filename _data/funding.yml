previous:
  - id: tracking-information-in-quantum-networks
    programme: Marie Skłodowska-Curie Global Fellowship
    award: Grant agreement 101025848
    period: August 2021–January 2024
    title: Tracking Information in Quantum Networks
    subtitle: TITAN
    description: >-
      Through this fellowship, I worked at [TU Munich](https://www.tum.de) with
      [Robert König](https://www.professoren.tum.de/en/koenig-robert-t) and at the
      [Centre for Quantum Technologies](https://www.quantumlah.org),
      [National University of Singapore](https://www.nus.edu.sg), with
      [Marco Tomamichel](https://marcotom.info). The project studied how entropic
      quantities can be used to understand information flow in quantum networks.
      The fellowship ended when I moved to Hannover.
    acknowledgement: >-
      This project received funding from the European Union’s Horizon 2020
      research and innovation programme under the Marie Skłodowska-Curie grant
      agreement No. 101025848.
    image: /images/EUflag.jpg
    image_alt: European Union flag
    url: https://cordis.europa.eu/project/id/101025848
    link_text: TITAN project archive
