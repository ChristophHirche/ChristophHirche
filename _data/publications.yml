- title: On Composite Quantum Hypothesis Testing
  image: compHT.png
  description: We extend quantum Stein's lemma in asymmetric quantum hypothesis testing to composite null
    and alternative hypotheses. As our main result, we show that the asymptotic error exponent for testing
    convex combinations of quantum states against convex combinations of quantum states can be written
    as a regularized quantum relative entropy formula. We prove that in general such a regularization
    is needed but also discuss various settings where our formula as well as extensions thereof become
    single-letter.
  authors: M.Berta, F. G. S. L. Brandao, C. Hirche
  link1:
    url: https://arxiv.org/abs/1709.07268
    display: arXiv:1709.07268
  link2:
    url: https://doi.org/10.1007/s00220-021-04133-8
    display: Communications in Mathematical Physics 385, 55–77 (2021)
  highlight: 1
  id: '1709.07268'
- title: Quantum Sequential Hypothesis Testing
  image: seqHT.png
  description: We introduce sequential analysis in quantum information processing, by focusing on the
    fundamental task of quantum hypothesis testing. Our goal is to discriminate between two arbitrary
    quantum states with a prescribed error threshold, ϵ, when copies of the states can be required on
    demand. We obtain ultimate lower bounds on the average number of copies needed to accomplish the task.
    We give a block-sampling strategy that allows to achieve the lower bound for some classes of states.
    The bound is optimal in both the symmetric as well as the asymmetric setting in the sense that it
    requires the least mean number of copies out of all other procedures.
  authors: E. Martínez-Vargas, C. Hirche, G. Sentís, M. Skotiniotis, M. Carrizo, R. Muñoz-Tapia, J. Calsamiglia
