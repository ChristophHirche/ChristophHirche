- id: '1808.01498'
  title: Amortized channel divergence for asymptotic quantum channel discrimination
  authors: Mark M. Wilde, Mario Berta, Christoph Hirche, Eneet Kaur
  year: 2020
  date: '2020-06-18'
  type: Journal article
  citation: Letters in Mathematical Physics 110, 2277–2336 (2020)
  doi: 10.1007/s11005-020-01297-7
  arxiv: '1808.01498'
  scholar_id: z_wVstp3MssC
  highlight: 1
  image: adap.png
  description: First, we establish the strong Stein's lemma for classical-quantum channels by showing that asymptotically
    the exponential error rate for classical-quantum channel discrimination is not improved by adaptive strategies.
    Second, we recover many other classes of channels for which adaptive strategies do not lead to an asymptotic
    advantage. Third, we give various converse bounds on the power of adaptive protocols for general asymptotic
    quantum channel discrimination.
