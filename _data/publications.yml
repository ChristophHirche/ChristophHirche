- id: '1709.07268'
  title: On Composite Quantum Hypothesis Testing
  authors: Mario Berta, Fernando G. S. L. Brandão, Christoph Hirche
  year: 2021
  date: '2021-06-10'
  type: Journal article
  citation: Communications in Mathematical Physics 385, 55–77 (2021)
  doi: 10.1007/s00220-021-04133-8
  arxiv: '1709.07268'
  scholar_id: ipzZ9siozwsC
  highlight: 1
  image: compHT.png
  description: We extend quantum Stein's lemma in asymmetric quantum hypothesis testing to composite null and alternative
    hypotheses. As our main result, we show that the asymptotic error exponent for testing convex combinations of
    quantum states against convex combinations of quantum states can be written as a regularized quantum relative
    entropy formula. We prove that in general such a regularization is needed but also discuss various settings
    where our formula as well as extensions thereof become single-letter.
- id: '2011.10773'
  title: Quantum Sequential Hypothesis Testing
  authors: Esteban Martínez Vargas, Christoph Hirche, Gael Sentís, Michalis Skotiniotis, Marta Carrizo, Ramon Muñoz-Tapia,
    John Calsamiglia
  year: 2021
  date: '2021-05-06'
  type: Journal article
  citation: Physical Review Letters 126, 180502 (2021)
  doi: 10.1103/physrevlett.126.180502
  arxiv: '2011.10773'
  scholar_id: 4MWp96NkSFoC
  selected_order: 12
  highlight: 1
  image: seqHT.png
  description: We introduce sequential analysis in quantum information processing, by focusing on the fundamental
    task of quantum hypothesis testing. Our goal is to discriminate between two arbitrary quantum states with a
    prescribed error threshold, ϵ, when copies of the states can be required on demand. We obtain ultimate lower
    bounds on the average number of copies needed to accomplish the task. We give a block-sampling strategy that
    allows to achieve the lower bound for some classes of states. The bound is optimal in both the symmetric as
    well as the asymmetric setting in the sense that it requires the least mean number of copies out of all other
    procedures.
