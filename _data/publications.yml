- id: '1706.09752'
  title: Bounds on Information Combining With Quantum Side Information
  authors: Christoph Hirche, David Reeb
  year: 2018
  date: 2018-07
  type: Journal article
  citation: IEEE Transactions on Information Theory 64, 4739–4757 (2018)
  doi: 10.1109/tit.2018.2842180
  conference_version:
    doi: 10.1109/isit.2018.8437773
    citation: IEEE International Symposium on Information Theory (ISIT), 896–900 (2018)
  arxiv: '1706.09752'
  scholar_id: -_dYPAW6P2MC
  highlight: 1
  image: IC.png
  description: Bounds on information combining are entropic inequalities that determine how the information (entropy)
    of a set of random variables can change when these are combined in certain prescribed ways. Such bounds play
    an important role in classical information theory, particularly in coding and Shannon theory; entropy power
    inequalities are special instances of them. The arguably most elementary kind of information combining is the
    addition of two binary random variables (a CNOT gate), and the resulting quantities play an important role in
    Belief propagation and Polar coding. We investigate this problem in the setting where quantum side information
    is available.
